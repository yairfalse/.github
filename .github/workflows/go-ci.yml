name: Reusable Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.21'
      run-integration-tests:
        description: 'Whether to run integration tests with Kind'
        required: false
        type: boolean
        default: false
      go-matrix-versions:
        description: 'Go versions to test (JSON array)'
        required: false
        type: string
        default: '["1.21"]'

jobs:
  # Parallel quality checks
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yairfalse/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ Unformatted files:" && echo "$unformatted" && exit 1
          fi

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yairfalse/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
      - run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yairfalse/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2
          args: --timeout=5m
          only-new-issues: true

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(inputs.go-matrix-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: yairfalse/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: go test -race -v -timeout=5m ./...

  integration:
    name: Integration Tests
    if: inputs.run-integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yairfalse/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
      - uses: yairfalse/.github/.github/actions/setup-kind@main
        with:
          cluster-name: integration-test
      - name: Run integration tests
        run: go test -v -tags=integration -timeout=10m ./...
      - name: Cleanup
        if: always()
        run: kind delete cluster --name integration-test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yairfalse/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
      - uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
      - uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: results.sarif

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, vet, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: yairfalse/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -ldflags="-s -w" -o bin/ ./...
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7
